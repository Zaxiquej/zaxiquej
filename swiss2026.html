<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>瑞士轮竞技模拟器 - 逻辑统一版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8fafc; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f1f5f9; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .config-item label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
        .config-item input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }

        .search-box { background: #e8f0fe; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-end; }
        .search-box div { flex: 1; }

        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; }
        th { background: #f8fafc; }
        .record-row { cursor: pointer; }
        .record-row:hover { background: #f1f5f9; }
        .detail-row { display: none; background: #fafafa; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-wrap { background: #fff; border: 1px solid #eee; padding: 10px; height: 300px; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .pass { background: #dcfce7; color: #166534; }
        .fail { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <h1>瑞士轮竞技模拟器</h1>

    <div class="config-grid">
        <div class="config-item"><label>活人总数 (k)</label><input type="number" id="kVal" value="48"></div>
        <div class="config-item"><label>总轮数 (n)</label><input type="number" id="rounds" value="5"></div>
        <div class="config-item"><label>晋级名额 (m)</label><input type="number" id="mVal" value="8"></div>
        <div class="config-item"><label>模拟次数 (X)</label><input type="number" id="simCount" value="1000"></div>
        <div class="config-item"><label>X败后退赛(挂机)</label><input type="number" id="dropThreshold" value="3"></div>
        <div class="config-item"><button onclick="startSim()" id="runBtn">开始模拟</button></div>
    </div>

    <div class="search-box">
        <div>
            <label style="font-size:12px; font-weight:bold">路径过滤 (W胜/L负/D退赛):</label>
            <input type="text" id="pathInput" placeholder="例如: WW, L, WL" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; text-transform:uppercase">
        </div>
        <select id="modeSelect" style="padding:8px; border-radius:6px">
            <option value="ge">小分模式: ≥</option>
            <option value="eq">小分模式: =</option>
        </select>
        <button onclick="updateUI()" style="background:#34a853">应用筛选</button>
    </div>

    <div class="stats-grid">
        <div class="chart-wrap"><canvas id="winChart"></canvas></div>
        <div class="chart-wrap"><canvas id="bhChart"></canvas></div>
    </div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>最终战绩</th>
                <th>样本数量</th>
                <th>晋级数量</th>
                <th>平均晋级率</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="mainBody"></tbody>
    </table>
</div>

<script>
let globalResults = [];
let chart1 = null, chart2 = null;

async function startSim() {
    const k = parseInt(document.getElementById('kVal').value);
    const n = parseInt(document.getElementById('rounds').value);
    const m = parseInt(document.getElementById('mVal').value);
    const X = parseInt(document.getElementById('simCount').value);
    const drop = parseInt(document.getElementById('dropThreshold').value);

    const runBtn = document.getElementById('runBtn');
    runBtn.disabled = true;
    runBtn.innerText = "模拟中...";
    await new Promise(r => setTimeout(r, 50));

    globalResults = [];
    const totalSlots = Math.pow(2, Math.ceil(Math.log2(k)));

    for (let s = 0; s < X; s++) {
        globalResults.push(...simulateSingle(k, totalSlots, n, m, drop));
    }

    runBtn.disabled = false;
    runBtn.innerText = "开始模拟";
    updateUI();
}

function simulateSingle(k, total, n, m, dropLimit) {
    let players = [];
    // 初始化池子
    for (let i = 0; i < total; i++) {
        players.push({
            id: i,
            isBot: i >= k, // 超过k的人是永远的补位机器人
            dropped: false,
            wins: 0,
            losses: 0,
            opponents: [],
            history: ""
        });
    }

    for (let r = 0; r < n; r++) {
        // 匹配排序：胜场 > 随机 (已退赛的人排在最后面)
        players.sort((a, b) => {
            if (a.dropped !== b.dropped) return a.dropped ? 1 : -1;
            return b.wins - a.wins || Math.random() - 0.5;
        });

        let matched = new Array(total).fill(false);
        for (let i = 0; i < total; i++) {
            if (matched[i]) continue;

            // 尝试匹配一个没打过的
            let found = false;
            for (let j = i + 1; j < total; j++) {
                if (!matched[j] && !players[i].opponents.includes(players[j].id)) {
                    doMatch(players[i], players[j]);
                    matched[i] = matched[j] = true;
                    found = true;
                    break;
                }
            }
            // 兜底匹配
            if (!found) {
                for (let j = i + 1; j < total; j++) {
                    if (!matched[j]) {
                        doMatch(players[i], players[j]);
                        matched[i] = matched[j] = true;
                        break;
                    }
                }
            }
        }

        // 判定退赛状态 (只针对活人)
        players.forEach(p => {
            if (!p.isBot && !p.dropped && p.losses >= dropLimit) {
                p.dropped = true;
            }
        });
    }

    // 计算小分 (Buchholz)
    players.forEach(p => {
        p.buchholz = p.opponents.reduce((s, id) => s + players.find(x => x.id === id).wins, 0);
    });

    // 活人结算排名
    let activeLiving = players.filter(p => !p.isBot);
    activeLiving.sort((a, b) => b.wins - a.wins || b.buchholz - a.buchholz || Math.random() - 0.5);
    activeLiving.forEach((p, idx) => p.qualified = idx < m);

    return activeLiving;
}

function doMatch(p1, p2) {
    p1.opponents.push(p2.id);
    p2.opponents.push(p1.id);

    // 如果有人已经退赛，他直接判负
    if (p1.dropped && p2.dropped) {
        p1.history += "D"; p2.history += "D";
    } else if (p1.dropped || p1.isBot) {
        p2.wins++; p2.history += "W"; p1.losses++; p1.history += (p1.dropped ? "D" : "L");
    } else if (p2.dropped || p2.isBot) {
        p1.wins++; p1.history += "W"; p2.losses++; p2.history += (p2.dropped ? "D" : "L");
    } else {
        // 两个正常活人对战
        if (Math.random() > 0.5) {
            p1.wins++; p1.history += "W"; p2.losses++; p2.history += "L";
        } else {
            p2.wins++; p2.history += "W"; p1.losses++; p1.history += "L";
        }
    }
}

function updateUI() {
    if (globalResults.length === 0) return;
    const filter = document.getElementById('pathInput').value.toUpperCase().replace(/\s+/g, '');
    const mode = document.getElementById('modeSelect').value;
    const n = parseInt(document.getElementById('rounds').value);

    const filtered = globalResults.filter(p => p.history.startsWith(filter));
    const winGroups = {};

    filtered.forEach(p => {
        if (!winGroups[p.wins]) winGroups[p.wins] = { count: 0, qual: 0, bhMap: {} };
        const g = winGroups[p.wins];
        g.count++;
        if (p.qualified) g.qual++;
        if (!g.bhMap[p.buchholz]) g.bhMap[p.buchholz] = { count: 0, qual: 0 };
        g.bhMap[p.buchholz].count++;
        if (p.qualified) g.bhMap[p.buchholz].qual++;
    });

    const body = document.getElementById('mainBody');
    body.innerHTML = '';
    const sortedWins = Object.keys(winGroups).map(Number).sort((a,b) => b-a);

    sortedWins.forEach(win => {
        const g = winGroups[win];
        const rate = (g.qual/g.count*100).toFixed(1);
        const row = document.createElement('tr');
        row.className = 'record-row';
        row.innerHTML = `<td>${win}胜-${n-win}负</td><td>${g.count}</td><td>${g.qual}</td><td><span class="badge ${rate>50?'pass':'fail'}">${rate}%</span></td><td>点击查看详情 ▾</td>`;
        row.onclick = () => {
            const d = document.getElementById(`detail-${win}`);
            d.style.display = d.style.display === 'table-row' ? 'none' : 'table-row';
        };
        body.appendChild(row);

        const dRow = document.createElement('tr');
        dRow.id = `detail-${win}`;
        dRow.className = 'detail-row';
        let detailHtml = `<td colspan="5" style="padding:15px"><table style="width:90%;margin:0 auto;border:1px solid #ddd">
            <tr style="background:#f4f4f4"><th>对手总胜场 (小分)</th><th>样本数</th><th>晋级数</th><th>晋级率 (${mode==='ge'?'≥':'='})</th></tr>`;

        const bhs = Object.keys(g.bhMap).map(Number).sort((a,b)=>b-a);
        bhs.forEach(bh => {
            let cCount = 0, cQual = 0;
            if (mode === 'ge') {
                bhs.forEach(b => { if(b >= bh) { cCount += g.bhMap[b].count; cQual += g.bhMap[b].qual; } });
            } else {
                cCount = g.bhMap[bh].count; cQual = g.bhMap[bh].qual;
            }
            detailHtml += `<tr><td>${bh}</td><td>${g.bhMap[bh].count}</td><td>${g.bhMap[bh].qual}</td><td>${(cQual/cCount*100).toFixed(1)}%</td></tr>`;
        });
        dRow.innerHTML = detailHtml + `</table></td>`;
        body.appendChild(dRow);
    });

    renderCharts(winGroups, sortedWins);
}

function renderCharts(groups, wins) {
    const labels = wins.map(w => w + "胜");
    const rates = wins.map(w => (groups[w].qual/groups[w].count*100).toFixed(1));
    if (chart1) chart1.destroy();
    chart1 = new Chart(document.getElementById('winChart'), {
        type: 'bar',
        data: { labels, datasets: [{ label: '晋级率 %', data: rates, backgroundColor: '#1a73e8' }] },
        options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
    });

    if (wins.length > 0) {
        const topWin = wins[0];
        const bhLabels = Object.keys(groups[topWin].bhMap).map(Number).sort((a,b)=>a-b);
        const bhCounts = bhLabels.map(l => groups[topWin].bhMap[l].count);
        if (chart2) chart2.destroy();
        chart2 = new Chart(document.getElementById('bhChart'), {
            type: 'line',
            data: { labels: bhLabels, datasets: [{ label: `小分样本分布 (${topWin}胜)`, data: bhCounts, borderColor: '#34a853', fill: true }] },
            options: { maintainAspectRatio: false }
        });
    }
}
</script>
</body>
</html>
