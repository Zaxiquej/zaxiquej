<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>瑞士轮模拟器 Pro - 含退赛挂机逻辑</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; font-weight: 800; }

        /* 配置区域 */
        .config-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f1f5f9; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .config-item label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #64748b; }
        .config-item input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .config-item input:focus { outline: 2px solid var(--primary); border-color: transparent; }

        /* 搜索区域 */
        .search-area { background: #eff6ff; padding: 20px; border-radius: 12px; border: 1px solid #bfdbfe; margin-bottom: 25px; }
        .search-flex { display: flex; gap: 12px; flex-wrap: wrap; }
        .search-flex input { flex: 1; min-width: 250px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; text-transform: uppercase; }
        .search-flex select { padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }

        /* 按钮 */
        button { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button#runBtn { width: 100%; font-size: 16px; margin-top: 10px; }

        /* 图表与数据 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-card { background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; height: 380px; }

        table { width: 100%; border-collapse: collapse; border-radius: 12px; overflow: hidden; }
        th { background: #f1f5f9; padding: 15px; font-size: 14px; text-align: center; color: #475569; }
        td { padding: 15px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .record-row { cursor: pointer; transition: background 0.2s; }
        .record-row:hover { background: #f8fafc; }

        .detail-row { display: none; background: #fafafa; }
        .inner-table { width: 90%; margin: 10px auto; background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-win { background: #dcfce7; color: #166534; }
        .badge-loss { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <h1>瑞士轮竞技模拟器 Pro</h1>

    <div class="config-section">
        <div class="config-item">
            <label>初始活人 (k)</label>
            <input type="number" id="kVal" value="48">
        </div>
        <div class="config-item">
            <label>比赛轮数 (n)</label>
            <input type="number" id="rounds" value="5">
        </div>
        <div class="config-item">
            <label>晋级名额 (m)</label>
            <input type="number" id="mVal" value="8">
        </div>
        <div class="config-item">
            <label>模拟次数 (X)</label>
            <input type="number" id="simCount" value="1000">
        </div>
        <div class="config-item">
            <label style="color:var(--danger)">X 败后挂机/退赛</label>
            <input type="number" id="dropThreshold" value="3">
        </div>
        <div class="config-item" style="display: flex; align-items: flex-end;">
            <button id="runBtn" onclick="runSimulation()">开始模拟</button>
        </div>
    </div>

    <div class="search-area">
        <label style="font-size: 13px; font-weight: bold; margin-bottom: 8px; display: block;">战绩路径过滤 (W=胜, L=负, D=退赛):</label>
        <div class="search-flex">
            <input type="text" id="pathInput" placeholder="例如: WW (前两场胜), L (首场负), WWW">
            <select id="modeSelect" onchange="updateUI()">
                <option value="ge">小分条件: ≥ (大于等于)</option>
                <option value="eq">小分条件: = (等于)</option>
            </select>
            <button onclick="updateUI()" style="background: var(--success)">立即检索</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="chart-card"><canvas id="mainChart"></canvas></div>
        <div class="chart-card"><canvas id="distChart"></canvas></div>
    </div>

    <div id="summaryText" style="margin-bottom: 15px; font-weight: 600;"></div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>最终战绩</th>
                <th>样本数</th>
                <th>平均小分</th>
                <th>晋级概率</th>
                <th>详细数据 (点击展开)</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
</div>

<script>
let allSimData = [];
let chartA = null;
let chartB = null;

async function runSimulation() {
    const k = parseInt(document.getElementById('kVal').value);
    const n = parseInt(document.getElementById('rounds').value);
    const m = parseInt(document.getElementById('mVal').value);
    const X = parseInt(document.getElementById('simCount').value);
    const dropAfter = parseInt(document.getElementById('dropThreshold').value);
    const btn = document.getElementById('runBtn');

    btn.disabled = true;
    btn.innerText = "正在模拟计算...";
    await new Promise(r => setTimeout(r, 100));

    allSimData = [];
    // 计算补足 2^K 的总人数（用于匹配引擎，多出的作为Bye）
    const totalP = Math.pow(2, Math.ceil(Math.log2(k)));

    for (let s = 0; s < X; s++) {
        allSimData.push(...simulateTournament(k, totalP, n, m, dropAfter));
    }

    btn.disabled = false;
    btn.innerText = "开始模拟";
    updateUI();
}

function simulateTournament(k, total, n, m, dropLimit) {
    let players = [];
    // 0 到 k-1 是活人
    for (let i = 0; i < total; i++) {
        players.push({
            id: i,
            isBye: i >= k,
            wins: 0,
            losses: 0,
            opponents: [],
            path: "",
            dropped: false,
            qualified: false,
            buchholz: 0
        });
    }

    for (let r = 0; r < n; r++) {
        // 1. 确定活跃选手：未退赛且不是预设Bye
        let active = players.filter(p => !p.dropped && !p.isBye);

        // 2. 匹配逻辑
        // 按照 胜场 > 随机 排序
        active.sort((a, b) => b.wins - a.wins || Math.random() - 0.5);

        let paired = new Set();
        for (let i = 0; i < active.length; i++) {
            if (paired.has(active[i].id)) continue;

            let found = false;
            for (let j = i + 1; j < active.length; j++) {
                if (!paired.has(active[j].id) && !active[i].opponents.includes(active[j].id)) {
                    match(active[i], active[j]);
                    paired.add(active[i].id);
                    paired.add(active[j].id);
                    found = true;
                    break;
                }
            }

            // 如果活人找不到人打（比如剩下奇数个，或都打过了），给个Bye
            if (!found) {
                active[i].wins++;
                active[i].path += "W";
                paired.add(active[i].id);
            }
        }

        // 3. 检查退赛：活人如果输了达到阈值，下一轮不再参与
        active.forEach(p => {
            if (p.losses >= dropLimit) {
                p.dropped = true;
                // 补全后续战绩路径为 D
                while(p.path.length < (r + 1)) p.path += "L"; // 最后一局记为L
            }
        });

        // 对于已经退赛的人，路径补D
        players.filter(p => p.dropped && p.path.length <= r).forEach(p => p.path += "D");
    }

    // 计算小分
    players.forEach(p => {
        p.buchholz = p.opponents.reduce((acc, oppId) => acc + players[oppId].wins, 0);
    });

    // 活人排名
    let living = players.filter(p => !p.isBye);
    living.sort((a, b) => b.wins - a.wins || b.buchholz - a.buchholz || Math.random() - 0.5);
    for (let i = 0; i < m && i < living.length; i++) {
        living[i].qualified = true;
    }

    return living;
}

function match(p1, p2) {
    p1.opponents.push(p2.id);
    p2.opponents.push(p1.id);
    if (Math.random() > 0.5) {
        p1.wins++; p2.losses++;
        p1.path += "W"; p2.path += "L";
    } else {
        p2.wins++; p1.losses++;
        p2.path += "W"; p1.path += "L";
    }
}

function updateUI() {
    if (allSimData.length === 0) return;

    const pathFilter = document.getElementById('pathInput').value.toUpperCase();
    const mode = document.getElementById('modeSelect').value;
    const n = parseInt(document.getElementById('rounds').value);

    // 过滤
    const filtered = allSimData.filter(p => p.path.startsWith(pathFilter));
    document.getElementById('summaryText').innerText = `检索到样本: ${filtered.length} (占总样本 ${(filtered.length/allSimData.length*100).toFixed(1)}%)`;

    // 聚合
    const groups = {};
    filtered.forEach(p => {
        const key = `${p.wins}-${n - p.wins}`;
        if (!groups[key]) groups[key] = { wins: p.wins, count: 0, qual: 0, bhs: {} };
        groups[key].count++;
        if (p.qualified) groups[key].qual++;

        if (!groups[key].bhs[p.buchholz]) groups[key].bhs[p.buchholz] = { count: 0, qual: 0 };
        groups[key].bhs[p.buchholz].count++;
        if (p.qualified) groups[key].bhs[p.buchholz].qual++;
    });

    const sortedKeys = Object.keys(groups).sort((a, b) => groups[b].wins - groups[a].wins);

    // 渲染表格
    const body = document.getElementById('resultBody');
    body.innerHTML = "";
    sortedKeys.forEach(key => {
        const g = groups[key];
        const rate = (g.qual / g.count * 100).toFixed(1);
        const avgBH = (Object.keys(g.bhs).reduce((a,b)=>a + b*g.bhs[b].count, 0) / g.count).toFixed(1);

        const row = document.createElement('tr');
        row.className = 'record-row';
        row.onclick = () => toggleRow(key);
        row.innerHTML = `
            <td><strong>${key}</strong></td>
            <td>${g.count}</td>
            <td>${avgBH}</td>
            <td><span class="badge ${rate > 50 ? 'badge-win' : 'badge-loss'}">${rate}%</span></td>
            <td>展开详情 ▾</td>
        `;
        body.appendChild(row);

        // 详情行
        const dRow = document.createElement('tr');
        dRow.id = `detail-${key}`;
        dRow.className = 'detail-row';

        let subTable = `<td colspan="5"><table class="inner-table"><thead><tr><th>小分 (对手总胜场)</th><th>样本数</th><th>晋级数</th><th>比例</th><th>晋级率 (${mode==='ge'?'≥':'='})</th></tr></thead><tbody>`;

        const bhKeys = Object.keys(g.bhs).map(Number).sort((a,b)=>b-a);
        bhKeys.forEach(bh => {
            let sCount = 0, sQual = 0;
            if (mode === 'ge') {
                bhKeys.forEach(target => { if (target >= bh) { sCount += g.bhs[target].count; sQual += g.bhs[target].qual; } });
            } else {
                sCount = g.bhs[bh].count; sQual = g.bhs[bh].qual;
            }
            const sRate = (sQual / sCount * 100).toFixed(1);
            subTable += `<tr>
                <td>${bh}</td>
                <td>${g.bhs[bh].count}</td>
                <td>${g.bhs[bh].qual}</td>
                <td>${(g.bhs[bh].count/g.count*100).toFixed(1)}%</td>
                <td><strong>${sRate}%</strong></td>
            </tr>`;
        });

        subTable += `</tbody></table></td>`;
        dRow.innerHTML = subTable;
        body.appendChild(dRow);
    });

    updateCharts(groups, sortedKeys);
}

function toggleRow(key) {
    const el = document.getElementById(`detail-${key}`);
    el.style.display = el.style.display === 'table-row' ? 'none' : 'table-row';
}

function updateCharts(groups, keys) {
    const labels = keys;
    const dataQual = keys.map(k => (groups[k].qual / groups[k].count * 100).toFixed(1));

    if (chartA) chartA.destroy();
    chartA = new Chart(document.getElementById('mainChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{ label: '最终晋级概率 %', data: dataQual, backgroundColor: '#3b82f6' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: '不同大分晋级率' } } }
    });

    // 小分分布（取最高频那个大分的数据）
    if (keys.length === 0) return;
    const topKey = keys[0];
    const bhLabels = Object.keys(groups[topKey].bhs).sort((a,b)=>a-b);
    const bhValues = bhLabels.map(l => groups[topKey].bhs[l].count);

    if (chartB) chartB.destroy();
    chartB = new Chart(document.getElementById('distChart'), {
        type: 'line',
        data: {
            labels: bhLabels,
            datasets: [{ label: `样本量 (战绩 ${topKey})`, data: bhValues, borderColor: '#10b981', fill: true, tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: '对手总胜场(小分)样本频率分布' } } }
    });
}
</script>
</body>
</html>
