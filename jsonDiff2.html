<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON翻译文件对比工具 2 (新旧版本对比)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .drop-zone:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .drop-zone.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .drop-zone.loaded {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .drop-zone-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .drop-zone-hint {
            color: #666;
            font-size: 14px;
        }

        .file-name {
            margin-top: 10px;
            color: #10b981;
            font-weight: bold;
        }

        .compare-btn {
            display: block;
            width: 200px;
            margin: 0 auto 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .compare-btn:hover {
            transform: translateY(-2px);
        }

        .compare-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .summary {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .summary h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .summary-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .summary-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .summary-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .results {
            display: none;
        }

        .result-section {
            margin-bottom: 30px;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-input {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            width: 220px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
            word-break: break-word;
        }

        th {
            font-weight: bold;
        }

        tbody tr:hover {
            background: #f8f9ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .missing {
            color: #ef4444;
            font-style: italic;
        }

        .old-value {
            color: #ef4444;
            text-decoration: line-through;
            opacity: 0.8;
        }

        .new-value {
            color: #10b981;
            font-weight: 500;
        }

        .no-issues {
            text-align: center;
            padding: 40px;
            color: #10b981;
            font-size: 18px;
            background: #ecfdf5;
            border-radius: 8px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .select-all-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: normal;
            white-space: nowrap;
            cursor: pointer;
        }

        .apply-col {
            width: 70px;
            text-align: center !important;
        }

        .apply-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .merge-bar {
            display: none;
            position: sticky;
            bottom: 0;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .merge-bar p {
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .merge-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .merge-btn:hover {
            transform: translateY(-2px);
        }

        .merge-status {
            margin-top: 12px;
            font-size: 13px;
            color: #10b981;
            font-weight: bold;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 JSON翻译文件对比工具 2</h1>
        <p class="subtitle">对比同一翻译文件的两个版本(旧版 / 新版)，找出新增、删除以及值发生变化的键</p>

        <div class="upload-section">
            <div class="drop-zone" id="oldZone">
                <div class="drop-zone-title">旧版本文件</div>
                <div class="drop-zone-hint">拖拽或点击上传JSON文件</div>
                <div class="file-name" id="oldFileName"></div>
            </div>
            <div class="drop-zone" id="newZone">
                <div class="drop-zone-title">新版本文件</div>
                <div class="drop-zone-hint">拖拽或点击上传JSON文件</div>
                <div class="file-name" id="newFileName"></div>
            </div>
        </div>

        <button class="compare-btn" id="compareBtn" disabled>开始对比</button>

        <div class="summary" id="summary">
            <h2>📊 对比摘要</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">旧版总键数</div>
                    <div class="summary-value" id="oldCount">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">新版总键数</div>
                    <div class="summary-value" id="newCount">0</div>
                </div>
                <div class="summary-item" style="border-left-color: #10b981;">
                    <div class="summary-label">新增的键</div>
                    <div class="summary-value" id="addedCount">0</div>
                </div>
                <div class="summary-item" style="border-left-color: #ef4444;">
                    <div class="summary-label">删除的键</div>
                    <div class="summary-value" id="removedCount">0</div>
                </div>
                <div class="summary-item" style="border-left-color: #f59e0b;">
                    <div class="summary-label">值变化的键</div>
                    <div class="summary-value" id="changedCount">0</div>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="result-section" id="changedSection">
                <h3>
                    <span>🔄 值发生变化的键</span>
                    <div class="header-controls">
                        <input type="text" class="filter-input" id="changedFilter" placeholder="筛选键路径...">
                        <label class="select-all-label"><input type="checkbox" id="changedSelectAll" checked> 全选(用新版)</label>
                    </div>
                </h3>
                <div id="changedTable"></div>
            </div>

            <div class="result-section" id="addedSection">
                <h3>
                    <span>✅ 新版本中新增的键</span>
                    <div class="header-controls">
                        <input type="text" class="filter-input" id="addedFilter" placeholder="筛选键路径...">
                        <label class="select-all-label"><input type="checkbox" id="addedSelectAll" checked> 全选(加入)</label>
                    </div>
                </h3>
                <div id="addedTable"></div>
            </div>

            <div class="result-section" id="removedSection">
                <h3>
                    <span>❌ 新版本中已删除的键</span>
                    <div class="header-controls">
                        <input type="text" class="filter-input" id="removedFilter" placeholder="筛选键路径...">
                        <label class="select-all-label"><input type="checkbox" id="removedSelectAll"> 全选(删除)</label>
                    </div>
                </h3>
                <div id="removedTable"></div>
            </div>

            <div class="merge-bar" id="mergeBar">
                <p>勾选每行右侧的"应用"复选框以决定是否采用新版本；点击下方按钮生成整合后的JSON文件</p>
                <button class="merge-btn" id="mergeBtn">🔀 一键替换并生成文件</button>
                <div class="merge-status" id="mergeStatus"></div>
            </div>
        </div>
    </div>

    <script>
        let oldData = null;
        let newData = null;

        // 保存原始数据用于筛选时重新渲染
        let cache = {
            changed: [],
            added: [],
            removed: []
        };

        // 保存每一行"应用"复选框的勾选状态(key -> boolean)
        // changed/added 默认勾选(采用新版)，removed 默认不勾选(默认保留旧版键，不删除)
        let selections = {
            changed: new Set(),
            added: new Set(),
            removed: new Set()
        };

        function setupDropZone(zoneId, fileNameId, dataVar) {
            const zone = document.getElementById(zoneId);
            const fileName = document.getElementById(fileNameId);

            zone.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => handleFile(e.target.files[0], fileName, dataVar, zone);
                input.click();
            });

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                handleFile(e.dataTransfer.files[0], fileName, dataVar, zone);
            });
        }

        function handleFile(file, fileNameElement, dataVar, zone) {
            if (!file || !file.name.endsWith('.json')) {
                alert('请上传JSON文件!');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (dataVar === 'old') {
                        oldData = data;
                    } else {
                        newData = data;
                    }
                    fileNameElement.textContent = `✓ ${file.name}`;
                    zone.classList.add('loaded');
                    checkReadyToCompare();
                } catch (error) {
                    alert('JSON文件格式错误!');
                }
            };
            reader.readAsText(file);
        }

        function checkReadyToCompare() {
            document.getElementById('compareBtn').disabled = !(oldData && newData);
        }

        function flattenObject(obj, prefix = '') {
            const result = {};
            for (const key in obj) {
                const newKey = prefix ? `${prefix}.${key}` : key;
                if (typeof obj[key] === 'object' && obj[key] !== null && !Array.isArray(obj[key])) {
                    Object.assign(result, flattenObject(obj[key], newKey));
                } else {
                    result[newKey] = obj[key];
                }
            }
            return result;
        }

        function valuesEqual(a, b) {
            // 用JSON序列化比较，能正确处理数组、数字、布尔值等
            return JSON.stringify(a) === JSON.stringify(b);
        }

        function compareJSON() {
            const flatOld = flattenObject(oldData);
            const flatNew = flattenObject(newData);

            const added = [];
            const removed = [];
            const changed = [];

            for (const key in flatNew) {
                if (!(key in flatOld)) {
                    added.push({ key, value: flatNew[key] });
                }
            }

            for (const key in flatOld) {
                if (!(key in flatNew)) {
                    removed.push({ key, value: flatOld[key] });
                } else if (!valuesEqual(flatOld[key], flatNew[key])) {
                    changed.push({ key, oldValue: flatOld[key], newValue: flatNew[key] });
                }
            }

            // 按键名排序，便于查看
            added.sort((a, b) => a.key.localeCompare(b.key));
            removed.sort((a, b) => a.key.localeCompare(b.key));
            changed.sort((a, b) => a.key.localeCompare(b.key));

            cache = { changed, added, removed };

            // 重置勾选状态: 变化/新增默认勾选(采用新版)，删除默认不勾选(保留旧版键)
            selections.changed = new Set(changed.map(item => item.key));
            selections.added = new Set(added.map(item => item.key));
            selections.removed = new Set();

            document.getElementById('changedSelectAll').checked = true;
            document.getElementById('addedSelectAll').checked = true;
            document.getElementById('removedSelectAll').checked = false;

            displayResults(flatOld, flatNew, added, removed, changed);
            document.getElementById('mergeBar').style.display = 'block';
            document.getElementById('mergeStatus').textContent = '';
        }

        function displayResults(oldFlat, newFlat, added, removed, changed) {
            document.getElementById('oldCount').textContent = Object.keys(oldFlat).length;
            document.getElementById('newCount').textContent = Object.keys(newFlat).length;
            document.getElementById('addedCount').textContent = added.length;
            document.getElementById('removedCount').textContent = removed.length;
            document.getElementById('changedCount').textContent = changed.length;

            document.getElementById('summary').style.display = 'block';
            document.getElementById('results').style.display = 'block';

            renderChangedTable(changed);
            renderAddedTable(added);
            renderRemovedTable(removed);
        }

        function renderChangedTable(data) {
            const container = document.getElementById('changedTable');
            if (data.length === 0) {
                container.innerHTML = '<div class="no-issues">✓ 没有值发生变化的键</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 27%">键路径</th>
                            <th style="width: 32%">旧版本值</th>
                            <th style="width: 32%">新版本值</th>
                            <th class="apply-col">应用</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(item => {
                const checked = selections.changed.has(item.key) ? 'checked' : '';
                html += `
                    <tr>
                        <td><strong>${escapeHtml(item.key)}</strong></td>
                        <td class="old-value">${escapeHtml(JSON.stringify(item.oldValue))}</td>
                        <td class="new-value">${escapeHtml(JSON.stringify(item.newValue))}</td>
                        <td class="apply-col"><input type="checkbox" class="apply-checkbox" data-section="changed" data-key="${escapeHtml(item.key)}" ${checked}></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
            bindApplyCheckboxes(container);
        }

        function renderAddedTable(data) {
            const container = document.getElementById('addedTable');
            if (data.length === 0) {
                container.innerHTML = '<div class="no-issues">✓ 没有新增的键</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 33%">键路径</th>
                            <th style="width: 47%">新版本值</th>
                            <th class="apply-col">应用</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(item => {
                const checked = selections.added.has(item.key) ? 'checked' : '';
                html += `
                    <tr>
                        <td><strong>${escapeHtml(item.key)}</strong></td>
                        <td>${escapeHtml(JSON.stringify(item.value))}</td>
                        <td class="apply-col"><input type="checkbox" class="apply-checkbox" data-section="added" data-key="${escapeHtml(item.key)}" ${checked}></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
            bindApplyCheckboxes(container);
        }

        function renderRemovedTable(data) {
            const container = document.getElementById('removedTable');
            if (data.length === 0) {
                container.innerHTML = '<div class="no-issues">✓ 没有删除的键</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 33%">键路径</th>
                            <th style="width: 47%">旧版本值</th>
                            <th class="apply-col">应用</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(item => {
                const checked = selections.removed.has(item.key) ? 'checked' : '';
                html += `
                    <tr>
                        <td><strong>${escapeHtml(item.key)}</strong></td>
                        <td class="missing">${escapeHtml(JSON.stringify(item.value))}</td>
                        <td class="apply-col"><input type="checkbox" class="apply-checkbox" data-section="removed" data-key="${escapeHtml(item.key)}" ${checked}></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
            bindApplyCheckboxes(container);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 为表格内的"应用"复选框绑定事件，勾选状态写入 selections
        function bindApplyCheckboxes(container) {
            container.querySelectorAll('.apply-checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    const section = cb.getAttribute('data-section');
                    const key = cb.getAttribute('data-key');
                    if (cb.checked) {
                        selections[section].add(key);
                    } else {
                        selections[section].delete(key);
                    }
                    syncSelectAllCheckbox(section);
                });
            });
        }

        // 根据当前section全部数据的勾选情况，更新表头"全选"复选框的状态
        function syncSelectAllCheckbox(section) {
            const selectAll = document.getElementById(section + 'SelectAll');
            if (!selectAll) return;
            const allKeys = cache[section].map(item => item.key);
            const allChecked = allKeys.length > 0 && allKeys.every(k => selections[section].has(k));
            selectAll.checked = allChecked;
        }

        function setupSelectAll(section, renderFn) {
            const selectAll = document.getElementById(section + 'SelectAll');
            selectAll.addEventListener('change', () => {
                if (selectAll.checked) {
                    selections[section] = new Set(cache[section].map(item => item.key));
                } else {
                    selections[section] = new Set();
                }
                // 重新渲染当前(可能被筛选过的)表格
                const filterInput = document.getElementById(section + 'Filter');
                const term = filterInput.value.trim().toLowerCase();
                const filtered = term
                    ? cache[section].filter(item => item.key.toLowerCase().includes(term))
                    : cache[section];
                renderFn(filtered);
            });
        }

        // 按点分隔的路径在对象中设置值，路径中间缺失的层级会自动创建为对象
        function setNestedValue(obj, path, value) {
            const parts = path.split('.');
            let cur = obj;
            for (let i = 0; i < parts.length - 1; i++) {
                const p = parts[i];
                if (typeof cur[p] !== 'object' || cur[p] === null || Array.isArray(cur[p])) {
                    cur[p] = {};
                }
                cur = cur[p];
            }
            cur[parts[parts.length - 1]] = value;
        }

        // 按点分隔的路径删除对象中的键
        function deleteNestedValue(obj, path) {
            const parts = path.split('.');
            let cur = obj;
            for (let i = 0; i < parts.length - 1; i++) {
                if (cur == null || typeof cur !== 'object') return;
                cur = cur[parts[i]];
            }
            if (cur && typeof cur === 'object') {
                delete cur[parts[parts.length - 1]];
            }
        }

        // 生成整合后的JSON: 以旧版本为基础，按勾选情况应用变化/新增/删除
        function generateMergedAndDownload() {
            if (!oldData) return;

            const merged = JSON.parse(JSON.stringify(oldData));

            cache.changed.forEach(item => {
                if (selections.changed.has(item.key)) {
                    setNestedValue(merged, item.key, item.newValue);
                }
            });

            cache.added.forEach(item => {
                if (selections.added.has(item.key)) {
                    setNestedValue(merged, item.key, item.value);
                }
            });

            cache.removed.forEach(item => {
                if (selections.removed.has(item.key)) {
                    deleteNestedValue(merged, item.key);
                }
            });

            const jsonStr = JSON.stringify(merged, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'merged.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            const appliedCount = selections.changed.size + selections.added.size + selections.removed.size;
            document.getElementById('mergeStatus').textContent =
                `✓ 已生成 merged.json (应用了 ${appliedCount} 处变更)，请查看浏览器下载`;
        }

        function setupFilter(inputId, renderFn, dataKey) {
            const input = document.getElementById(inputId);
            input.addEventListener('input', () => {
                const term = input.value.trim().toLowerCase();
                const filtered = term
                    ? cache[dataKey].filter(item => item.key.toLowerCase().includes(term))
                    : cache[dataKey];
                renderFn(filtered);
            });
        }

        setupDropZone('oldZone', 'oldFileName', 'old');
        setupDropZone('newZone', 'newFileName', 'new');

        document.getElementById('compareBtn').addEventListener('click', compareJSON);

        setupFilter('changedFilter', renderChangedTable, 'changed');
        setupFilter('addedFilter', renderAddedTable, 'added');
        setupFilter('removedFilter', renderRemovedTable, 'removed');

        setupSelectAll('changed', renderChangedTable);
        setupSelectAll('added', renderAddedTable);
        setupSelectAll('removed', renderRemovedTable);

        document.getElementById('mergeBtn').addEventListener('click', generateMergedAndDownload);
    </script>
