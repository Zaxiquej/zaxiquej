<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影之诗·超凡世界抽卡模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-button {
            background: none;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            color: #64748b;
            font-weight: 500;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card-pack-selector {
            margin-bottom: 30px;
            text-align: center;
        }

        .card-pack-selector label {
            font-size: 18px;
            font-weight: 600;
            color: #4a5568;
            margin-right: 15px;
        }

        .card-pack-selector select {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card-pack-selector select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .result-card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .rarity-section {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .rarity-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #4a5568;
        }

        .rarity-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 14px;
            color: #64748b;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .collection-progress {
            display: flex;
            justify-content: space-between;
            background: #edf2f7;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .progress-value {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }

            .tab-button {
                padding: 10px 15px;
                font-size: 14px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>影之诗·超凡世界抽卡模拟器</h1>

        <div class="card-pack-selector">
            <label for="cardPack">选择卡包：</label>
            <select id="cardPack">
                <option value="legend">第一弹卡包：传说揭幕</option>
            </select>
        </div>

        <div class="tab-container">
            <button class="tab-button active" onclick="switchTab('simulate')">抽卡模拟</button>
            <button class="tab-button" onclick="switchTab('collection')">收集统计</button>
            <button class="tab-button" onclick="switchTab('ether')">以太计算</button>''
        </div>

        <div id="simulate" class="tab-content active">
            <div class="input-group">
                <label for="packCount">抽取卡包数量：</label>
                <input type="number" id="packCount" min="1" max="10000" value="10">
            </div>
            <button class="button" onclick="simulateGacha()">开始模拟抽卡</button>
            <div id="simulateResult"></div>
        </div>

        <div id="collection" class="tab-content">
            <div class="input-group">
                <label for="collectionTarget">收集目标：</label>
                <select id="collectionTarget">
                    <option value="normal">全图鉴（每张至少1普通）</option>
                    <option value="foil">全闪图鉴（每张至少1闪）</option>
                    <option value="complete">全卡（每张普+闪至少3张）</option>
                    <option value="maxFoil">全闪卡（每张3闪）</option>
                </select>
            </div>
            <div class="input-group">
                <label for="monteCarloRuns">蒙特卡洛模拟次数：</label>
                <input type="number" id="monteCarloRuns" min="100" max="10000" value="1000">
            </div>
            <button class="button" onclick="runMonteCarlo()">开始蒙特卡洛模拟</button>
            <div id="monteCarloResult"></div>
        </div>

        <div id="ether" class="tab-content">
            <div class="two-column">
                <div>
                    <div class="input-group">
                        <label for="existingPacks">已抽取卡包数量（X）：</label>
                        <input type="number" id="existingPacks" min="0" max="10000" value="0">
                    </div>
                    <div class="input-group">
                        <label for="additionalPacks">额外抽取卡包数量（Y）：</label>
                        <input type="number" id="additionalPacks" min="1" max="10000" value="10">
                    </div>
                </div>
                <div>
                    <div class="input-group">
                        <label for="dissolveStrategy">分解策略：</label>
                        <select id="dissolveStrategy">
                            <option value="prioritizeFoil">优先分解闪卡</option>
                            <option value="prioritizeNormal">优先分解普卡</option>
                            <option value="keep3Each">尽量保留3普3闪</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="etherRuns">模拟次数：</label>
                        <input type="number" id="etherRuns" min="100" max="5000" value="1000">
                    </div>
                </div>
            </div>
            <button class="button" onclick="calculateEther()">计算以太期望</button>
            <div id="etherResult"></div>
        </div>
    </div>

    <script>
        // 卡包配置
        const cardPacks = {
            legend: {
                name: "第一弹卡包：传说揭幕",
                cards: {
                    voucher: 4,
                    rainbow: 23,
                    gold: 37,
                    silver: 37,
                    bronze: 45
                }
            }
        };

        // 抽卡概率配置
        const probabilities = {
            first7: {
                voucher: 0.0006,
                rainbow: 0.015,
                gold: 0.06,
                silver: 0.25,
                bronze: 0.6744
            },
            eighth: {
                voucher: 0.0006,
                rainbow: 0.015,
                gold: 0.06,
                silver: 0.9244
            }
        };

        // 分解价值
        const dissolveValues = {
            bronze: { normal: 10, foil: 30 },
            silver: { normal: 20, foil: 50 },
            gold: { normal: 200, foil: 450 },
            rainbow: { normal: 1200, foil: 2500 }
        };

        let currentPack = 'legend';
        let rainbowPity = 0;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function drawCard(isEighth = false) {
            const isFoil = Math.random() < 0.08;
            const probs = isEighth ? probabilities.eighth : probabilities.first7;
            const rand = Math.random();

            let rarity;
            if (rand < probs.voucher) {
                rarity = 'voucher';
            } else if (rand < probs.voucher + probs.rainbow) {
                rarity = 'rainbow';
            } else if (rand < probs.voucher + probs.rainbow + probs.gold) {
                rarity = 'gold';
            } else if (rand < probs.voucher + probs.rainbow + probs.gold + probs.silver) {
                rarity = 'silver';
            } else {
                rarity = 'bronze';
            }

            const cardCount = cardPacks[currentPack].cards[rarity];
            const cardId = Math.floor(Math.random() * cardCount);

            return {
                rarity: rarity,
                cardId: cardId,
                isFoil: isFoil
            };
        }

        function drawPack() {
            const pack = [];
            let hasRainbow = false;

            // 抽前7张卡
            for (let i = 0; i < 7; i++) {
                const card = drawCard(false);
                pack.push(card);
                if (card.rarity === 'rainbow') {
                    hasRainbow = true;
                }
            }

            // 抽第8张卡
            let eighthCard = drawCard(true);
            if (eighthCard.rarity === 'rainbow') {
                hasRainbow = true;
            }

            // 保底机制
            if (!hasRainbow) {
                rainbowPity++;
                if (rainbowPity >= 10) {
                    // 替换第8张卡为随机虹卡
                    eighthCard = {
                        rarity: 'rainbow',
                        cardId: Math.floor(Math.random() * cardPacks[currentPack].cards.rainbow),
                        isFoil: Math.random() < 0.08
                    };
                    rainbowPity = 0;
                }
            } else {
                rainbowPity = 0;
            }

            pack.push(eighthCard);
            return pack;
        }

        function initializeCollection() {
            const collection = {};
            for (const [rarity, count] of Object.entries(cardPacks[currentPack].cards)) {
                if (rarity !== 'voucher') {
                    collection[rarity] = {};
                    for (let i = 0; i < count; i++) {
                        collection[rarity][i] = { normal: 0, foil: 0 };
                    }
                }
            }
            return collection;
        }

        function addCardToCollection(collection, card) {
            if (card.rarity === 'voucher') return;

            if (!collection[card.rarity][card.cardId]) {
                collection[card.rarity][card.cardId] = { normal: 0, foil: 0 };
            }

            if (card.isFoil) {
                collection[card.rarity][card.cardId].foil++;
            } else {
                collection[card.rarity][card.cardId].normal++;
            }
        }

        function simulateGacha() {
            const packCount = parseInt(document.getElementById('packCount').value);
            rainbowPity = 0;

            const collection = initializeCollection();
            const voucherCount = { normal: 0, foil: 0 };

            for (let i = 0; i < packCount; i++) {
                const pack = drawPack();
                for (const card of pack) {
                    if (card.rarity === 'voucher') {
                        if (card.isFoil) {
                            voucherCount.foil++;
                        } else {
                            voucherCount.normal++;
                        }
                    } else {
                        addCardToCollection(collection, card);
                    }
                }
            }

            displaySimulationResult(collection, voucherCount, packCount);
        }

        function displaySimulationResult(collection, voucherCount, packCount) {
            let html = `<div class="result-card">
                <h3>抽卡结果 - 共${packCount}包</h3>`;

            // 兑换券结果 - 只显示总数量（不分普通和闪卡）
            const totalVouchers = voucherCount.normal + voucherCount.foil;
            if (totalVouchers > 0) {
                html += `<div class="rarity-section">
                    <div class="rarity-title">兑换券</div>
                    <div class="rarity-stats">
                        <div>总获得：${totalVouchers}张</div>
                    </div>
                </div>`;
            }

            // 各稀有度统计
            const rarityNames = {
                rainbow: '虹卡',
                gold: '金卡',
                silver: '银卡',
                bronze: '铜卡'
            };

            // 计算总卡牌种类数（不包括兑换券）
            let totalCards = 0;
            for (const rarity in rarityNames) {
                totalCards += cardPacks[currentPack].cards[rarity];
            }

            // 计算收藏进度
            let collectedCards = 0;
            let foilCollectedCards = 0;

            for (const [rarity, name] of Object.entries(rarityNames)) {
                const stats = analyzeRarityNew(collection[rarity], cardPacks[currentPack].cards[rarity]);
                collectedCards += stats.collected;
                foilCollectedCards += stats.foilCollected;

                html += `<div class="rarity-section">
                    <div class="rarity-title">${name}</div>
                    <div class="collection-progress">
                        <div>收藏进度: <span class="progress-value">${stats.collected}/${stats.totalCards}</span></div>
                        <div>闪卡进度: <span class="progress-value">${stats.foilCollected}/${stats.totalCards}</span></div>
                    </div>
                    <div class="rarity-stats">
                        <div>3张: ${stats.countDist['3+']}种</div>
                        <div>2张: ${stats.countDist[2]}种</div>
                        <div>1张: ${stats.countDist[1]}种</div>
                        <div>0张: ${stats.countDist[0]}种</div>
                    </div>
                </div>`;
            }

            // 添加总体收藏进度
            html = `<div class="result-card">
                <h3>抽卡结果 - 共${packCount}包</h3>
                <div class="collection-progress">
                    <div>总收藏进度: <span class="progress-value">${collectedCards}/${totalCards}</span></div>
                    <div>总闪卡进度: <span class="progress-value">${foilCollectedCards}/${totalCards}</span></div>
                </div>
                ${html.substring(html.indexOf('<div class="rarity-section">'))}`;

            html += '</div>';
            document.getElementById('simulateResult').innerHTML = html;
        }

        // 新的稀有度分析函数 - 按持有数量分组
        function analyzeRarityNew(rarityCollection, totalCards) {
            // 统计持有数量分布: 0,1,2,3+
            const countDist = {0:0, 1:0, 2:0, '3+':0};
            let collected = 0; // 至少有一张
            let foilCollected = 0; // 至少有一张闪卡

            for (const cardId in rarityCollection) {
                const counts = rarityCollection[cardId];
                const total = counts.normal + counts.foil;

                if (total === 0) {
                    countDist[0]++;
                } else if (total === 1) {
                    countDist[1]++;
                    collected++;
                } else if (total === 2) {
                    countDist[2]++;
                    collected++;
                } else {
                    countDist['3+']++;
                    collected++;
                }

                if (counts.foil > 0) {
                    foilCollected++;
                }
            }

            return {
                countDist: countDist,
                collected: collected,
                foilCollected: foilCollected,
                totalCards: totalCards
            };
        }

        function runMonteCarlo() {
            const target = document.getElementById('collectionTarget').value;
            const runs = parseInt(document.getElementById('monteCarloRuns').value);

            document.getElementById('monteCarloResult').innerHTML = `
                <div class="loading">正在进行蒙特卡洛模拟...</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
            `;

            setTimeout(() => {
                const results = [];

                for (let run = 0; run < runs; run++) {
                    const packsNeeded = simulateCollectionTarget(target);
                    results.push(packsNeeded);

                    if (run % 50 === 0) {
                        const progress = (run / runs) * 100;
                        document.querySelector('.progress-fill').style.width = progress + '%';
                    }
                }

                results.sort((a, b) => a - b);

                const average = results.reduce((a, b) => a + b, 0) / results.length;
                const median = results[Math.floor(results.length / 2)];
                const p90 = results[Math.floor(results.length * 0.9)];
                const p95 = results[Math.floor(results.length * 0.95)];

                const targetNames = {
                    normal: '全图鉴（每张至少1普通）',
                    foil: '全闪图鉴（每张至少1闪）',
                    complete: '全卡（每张普+闪至少3张）',
                    maxFoil: '全闪卡（每张3闪）'
                };

                document.getElementById('monteCarloResult').innerHTML = `
                    <div class="result-card">
                        <h3>${targetNames[target]} - 蒙特卡洛模拟结果</h3>
                        <div class="rarity-section">
                            <div class="rarity-stats">
                                <div>平均需要卡包：${Math.round(average)}包</div>
                                <div>中位数：${median}包</div>
                                <div>90%概率内：${p90}包</div>
                                <div>95%概率内：${p95}包</div>
                            </div>
                        </div>
                    </div>
                `;
            }, 100);
        }

        function simulateCollectionTarget(target) {
            rainbowPity = 0;
            const collection = initializeCollection();
            let packs = 0;

            while (!checkCollectionTarget(collection, target)) {
                const pack = drawPack();
                packs++;

                for (const card of pack) {
                    addCardToCollection(collection, card);
                }

                if (packs > 100000) break; // 防止无限循环
            }

            return packs;
        }

        // 检查收藏目标 - 排除兑换券
        function checkCollectionTarget(collection, target) {
            for (const [rarity, cards] of Object.entries(collection)) {
                for (const [cardId, counts] of Object.entries(cards)) {
                    switch (target) {
                        case 'normal':
                            if (counts.normal === 0) return false;
                            break;
                        case 'foil':
                            if (counts.foil === 0) return false;
                            break;
                        case 'complete':
                            if (counts.normal + counts.foil < 3) return false;
                            break;
                        case 'maxFoil':
                            if (counts.foil < 3) return false;
                            break;
                    }
                }
            }
            return true;
        }

        function calculateEther() {
            const existingPacks = parseInt(document.getElementById('existingPacks').value);
            const additionalPacks = parseInt(document.getElementById('additionalPacks').value);
            const strategy = document.getElementById('dissolveStrategy').value;
            const runs = parseInt(document.getElementById('etherRuns').value);

            document.getElementById('etherResult').innerHTML = `
                <div class="loading">正在计算以太期望...</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
            `;

            setTimeout(() => {
                const etherResults = [];

                for (let run = 0; run < runs; run++) {
                    const etherGained = simulateEtherGain(existingPacks, additionalPacks, strategy);
                    etherResults.push(etherGained);

                    if (run % 50 === 0) {
                        const progress = (run / runs) * 100;
                        document.querySelector('.progress-fill').style.width = progress + '%';
                    }
                }

                const averageEther = etherResults.reduce((a, b) => a + b, 0) / etherResults.length;
                const minEther = Math.min(...etherResults);
                const maxEther = Math.max(...etherResults);

                const strategyNames = {
                    prioritizeFoil: '优先分解闪卡',
                    prioritizeNormal: '优先分解普卡',
                    keep3Each: '尽量保留3普3闪'
                };

                document.getElementById('etherResult').innerHTML = `
                    <div class="result-card">
                        <h3>以太期望计算结果</h3>
                        <div class="rarity-section">
                            <div class="rarity-stats">
                                <div>已抽卡包：${existingPacks}包</div>
                                <div>额外卡包：${additionalPacks}包</div>
                                <div>分解策略：${strategyNames[strategy]}</div>
                                <div>平均以太：${Math.round(averageEther)}</div>
                                <div>最少以太：${minEther}</div>
                                <div>最多以太：${maxEther}</div>
                            </div>
                        </div>
                    </div>
                `;
            }, 100);
        }

        function simulateEtherGain(existingPacks, additionalPacks, strategy) {
            rainbowPity = 0;

            // 模拟已有卡包
            const existingCollection = initializeCollection();
            for (let i = 0; i < existingPacks; i++) {
                const pack = drawPack();
                for (const card of pack) {
                    addCardToCollection(existingCollection, card);
                }
            }

            // 按策略分解已有卡牌
            dissolveCards(existingCollection, strategy);

            // 模拟额外卡包并计算以太
            let totalEther = 0;
            for (let i = 0; i < additionalPacks; i++) {
                const pack = drawPack();
                for (const card of pack) {
                    if (card.rarity === 'voucher') continue;

                    addCardToCollection(existingCollection, card);
                    totalEther += calculateCardEther(existingCollection, card.rarity, card.cardId, strategy);
                }
            }

            return totalEther;
        }

        function dissolveCards(collection, strategy) {
            for (const [rarity, cards] of Object.entries(collection)) {
                for (const [cardId, counts] of Object.entries(cards)) {
                    const total = counts.normal + counts.foil;
                    if (total <= 3) continue;

                    switch (strategy) {
                        case 'prioritizeFoil':
                            if (counts.foil > 0) {
                                const dissolveCount = Math.min(counts.foil, total - 3);
                                counts.foil -= dissolveCount;
                            }
                            if (counts.normal + counts.foil > 3) {
                                counts.normal = 3 - counts.foil;
                            }
                            break;
                        case 'prioritizeNormal':
                            if (counts.normal > 0) {
                                const dissolveCount = Math.min(counts.normal, total - 3);
                                counts.normal -= dissolveCount;
                            }
                            if (counts.normal + counts.foil > 3) {
                                counts.foil = 3 - counts.normal;
                            }
                            break;
                        case 'keep3Each':
                            if (counts.normal > 3) counts.normal = 3;
                            if (counts.foil > 3) counts.foil = 3;
                            break;
                    }
                }
            }
        }

        function calculateCardEther(collection, rarity, cardId, strategy) {
            const counts = collection[rarity][cardId];
            const total = counts.normal + counts.foil;

            if (total <= 3) return 0;

            let etherGained = 0;
            const values = dissolveValues[rarity];

            switch (strategy) {
                case 'prioritizeFoil':
                    if (counts.foil > 0) {
                        etherGained = values.foil;
                        counts.foil--;
                    } else if (counts.normal > 0) {
                        etherGained = values.normal;
                        counts.normal--;
                    }
                    break;
                case 'prioritizeNormal':
                    if (counts.normal > 0) {
                        etherGained = values.normal;
                        counts.normal--;
                    } else if (counts.foil > 0) {
                        etherGained = values.foil;
                        counts.foil--;
                    }
                    break;
                case 'keep3Each':
                    if (counts.normal > 3) {
                        etherGained = values.normal;
                        counts.normal--;
                    } else if (counts.foil > 3) {
                        etherGained = values.foil;
                        counts.foil--;
                    }
                    break;
            }

            return etherGained;
        }

        // 初始化
        document.getElementById('cardPack').addEventListener('change', function() {
            currentPack = this.value;
        });
    </script>
