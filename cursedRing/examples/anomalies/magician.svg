<text x="326" y="82" fill="#f7f2e7" text-anchor="start" font-size="15" font-weight="400">所有发言先按交换前的位置生成，然后2号与7号</text><text x="326" y="105" fill="#f7f2e7" text-anchor="start" font-size="15" font-weight="400">秘密交换。公开候选序号里会包含另一个交换位置</text><text x="326" y="128" fill="#f7f2e7" text-anchor="start" font-size="15" font-weight="400">；其他提示中提到的“2号”仍指交换前原本的2</text><text x="326" y="151" fill="#f7f2e7" text-anchor="start" font-size="15" font-weight="400">号饰品。</text>
