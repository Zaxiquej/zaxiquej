<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG画廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .daily-section {
            padding: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .daily-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .daily-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .daily-date {
            font-size: 0.6em;
            color: #666;
            font-weight: 400;
        }

        .draw-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .draw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .daily-grid {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .draw-result {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 12px;
            display: none;
            position: relative;
        }

        .draw-result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .draw-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .draw-result-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .draw-result-toggle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            color: #333;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .draw-result-toggle:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: scale(1.1);
        }

        .draw-grid {
            display: flex;
            justify-content: center;
        }

        .draw-grid.collapsed {
            display: none;
        }

        .content {
            padding: 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .cg-item {
            position: relative;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .cg-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .cg-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cg-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
        }

        /* 灯箱样式 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .lightbox.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .lightbox-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2001;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2001;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-nav.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .lightbox-nav.disabled:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%);
        }

        .lightbox-prev {
            left: 30px;
        }

        .lightbox-next {
            right: 30px;
        }

        .lightbox-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 16px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .lightbox-nav {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .lightbox-prev {
                left: 10px;
            }

            .lightbox-next {
                right: 10px;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
                width: 45px;
                height: 45px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ CG画廊</h1>
        </div>

        <div class="daily-section">
            <div class="daily-header">
                <div class="daily-title">
                    ✨ 今日CG
                    <span class="daily-date" id="dailyDate"></span>
                </div>
                <button class="draw-btn" onclick="drawCG()">
                    🎲 抽取一张CG
                </button>
            </div>
            <div class="daily-grid" id="dailyGrid"></div>

            <div class="draw-result" id="drawResult">
                <div class="draw-result-header">
                    <div class="draw-result-title">🎉 抽取结果：</div>
                    <button class="draw-result-toggle" id="drawResultToggle" onclick="toggleDrawResult()">−</button>
                </div>
                <div class="draw-grid" id="drawGrid"></div>
            </div>
        </div>

        <div class="content">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">×</button>
        <button class="lightbox-nav lightbox-prev" id="prevBtn" onclick="navigateCG(-1, event)">‹</button>
        <div class="lightbox-content">
            <img class="lightbox-image" id="lightboxImage" src="" alt="CG">
        </div>
        <button class="lightbox-nav lightbox-next" id="nextBtn" onclick="navigateCG(1, event)">›</button>
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== 配置区域 ====================
        const CG_FOLDER = "cg+";  // CG文件夹路径
        const CG_COUNT = 54;     // CG总数
        const CG_EXT = "png";    // 文件扩展名
        // ================================================

        let allCGs = [];
        let currentCGIndex = 0;

        // 生成CG路径数组
        function generateCGPaths() {
            const cgs = [];
            for (let i = 1; i <= CG_COUNT; i++) {
                cgs.push(`${CG_FOLDER}/${i}.${CG_EXT}`);
            }
            return cgs;
        }

        // 使用日期作为种子的随机数生成器
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        // 获取今天的日期种子
        function getTodaySeed() {
            const today = new Date();
            return today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
        }

        // 基于种子随机抽取
        function seededShuffle(array, seed) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(seededRandom(seed + i) * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 渲染今日CG
        function renderDailyCG() {
            const dailyGrid = document.getElementById('dailyGrid');
            const dailyDate = document.getElementById('dailyDate');
            const today = new Date();
            dailyDate.textContent = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}`;

            const seed = getTodaySeed();
            const shuffled = seededShuffle(allCGs, seed);
            const dailyCG = shuffled[0];
            const cgNumber = allCGs.indexOf(dailyCG) + 1;

            dailyGrid.innerHTML = `
                <div class="cg-item" style="width: 300px;" onclick="openLightbox(${allCGs.indexOf(dailyCG)})">
                    <img src="${dailyCG}" alt="CG ${cgNumber}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22169%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22169%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2220%22%3E加载失败%3C/text%3E%3C/svg%3E'">
                    <span class="cg-number">#${cgNumber}</span>
                </div>
            `;
        }

        // 切换抽取结果显示/隐藏
        function toggleDrawResult() {
            const drawGrid = document.getElementById('drawGrid');
            const toggle = document.getElementById('drawResultToggle');

            if (drawGrid.classList.contains('collapsed')) {
                drawGrid.classList.remove('collapsed');
                toggle.textContent = '−';
            } else {
                drawGrid.classList.add('collapsed');
                toggle.textContent = '+';
            }
        }

        // 抽取CG
        function drawCG() {
            const drawResult = document.getElementById('drawResult');
            const drawGrid = document.getElementById('drawGrid');
            const toggle = document.getElementById('drawResultToggle');

            const shuffled = [...allCGs].sort(() => Math.random() - 0.5);
            const drawn = shuffled[0];
            const cgNumber = allCGs.indexOf(drawn) + 1;

            drawGrid.innerHTML = `
                <div class="cg-item" style="width: 300px;" onclick="openLightbox(${allCGs.indexOf(drawn)})">
                    <img src="${drawn}" alt="CG ${cgNumber}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22169%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22169%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2220%22%3E加载失败%3C/text%3E%3C/svg%3E'">
                    <span class="cg-number">#${cgNumber}</span>
                </div>
            `;

            drawGrid.classList.remove('collapsed');
            toggle.textContent = '−';
            drawResult.classList.add('show');
            setTimeout(() => {
                drawResult.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // 渲染画廊
        function renderGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = allCGs.map((cg, idx) => `
                <div class="cg-item" onclick="openLightbox(${idx})">
                    <img src="${cg}" alt="CG ${idx + 1}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22169%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22169%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2220%22%3E${idx + 1}%3C/text%3E%3C/svg%3E'">
                    <span class="cg-number">#${idx + 1}</span>
                </div>
            `).join('');
        }

        // 打开灯箱
        function openLightbox(index) {
            currentCGIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭灯箱
        function closeLightbox(event) {
            if (event) {
                event.stopPropagation();
                if (event.target.id === 'lightboxImage') return;
            }
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 导航CG
        function navigateCG(direction, event) {
            event.stopPropagation();
            const newIndex = currentCGIndex + direction;
            if (newIndex >= 0 && newIndex < allCGs.length) {
                currentCGIndex = newIndex;
                updateLightbox();
            }
        }

        // 更新灯箱内容
        function updateLightbox() {
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxInfo = document.getElementById('lightboxInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            lightboxImage.src = allCGs[currentCGIndex];
            lightboxInfo.textContent = `CG #${currentCGIndex + 1} / ${allCGs.length}`;

            // 更新按钮状态
            if (currentCGIndex === 0) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }

            if (currentCGIndex === allCGs.length - 1) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('show')) {
                if (e.key === 'ArrowLeft' && currentCGIndex > 0) {
                    navigateCG(-1, e);
                } else if (e.key === 'ArrowRight' && currentCGIndex < allCGs.length - 1) {
                    navigateCG(1, e);
                } else if (e.key === 'Escape') {
                    closeLightbox(e);
                }
            }
        });

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 初始化
        function init() {
            allCGs = generateCGPaths();
            renderDailyCG();
            renderGallery();
        }

        // 启动应用
        init();
    </script>
</body>
</html>
