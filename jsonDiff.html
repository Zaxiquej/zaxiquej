<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON翻译文件对比工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .drop-zone:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .drop-zone.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .drop-zone.loaded {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .drop-zone-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .drop-zone-hint {
            color: #666;
            font-size: 14px;
        }

        .file-name {
            margin-top: 10px;
            color: #10b981;
            font-weight: bold;
        }

        .compare-btn {
            display: block;
            width: 200px;
            margin: 0 auto 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .compare-btn:hover {
            transform: translateY(-2px);
        }

        .compare-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .summary {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .summary h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .summary-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .summary-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .summary-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .results {
            display: none;
        }

        .result-section {
            margin-bottom: 30px;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            font-weight: bold;
        }

        tbody tr:hover {
            background: #f8f9ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .missing {
            color: #ef4444;
            font-style: italic;
        }

        .no-issues {
            text-align: center;
            padding: 40px;
            color: #10b981;
            font-size: 18px;
            background: #ecfdf5;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 JSON翻译文件对比工具</h1>
        <p class="subtitle">拖拽或点击上传原文和翻译文件,自动检查缺失的翻译键</p>

        <div class="upload-section">
            <div class="drop-zone" id="originalZone">
                <div class="drop-zone-title">原文文件</div>
                <div class="drop-zone-hint">拖拽或点击上传JSON文件</div>
                <div class="file-name" id="originalFileName"></div>
            </div>
            <div class="drop-zone" id="translationZone">
                <div class="drop-zone-title">翻译文件</div>
                <div class="drop-zone-hint">拖拽或点击上传JSON文件</div>
                <div class="file-name" id="translationFileName"></div>
            </div>
        </div>

        <button class="compare-btn" id="compareBtn" disabled>开始对比</button>

        <div class="summary" id="summary">
            <h2>📊 对比摘要</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">原文总键数</div>
                    <div class="summary-value" id="originalCount">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">翻译总键数</div>
                    <div class="summary-value" id="translationCount">0</div>
                </div>
                <div class="summary-item" style="border-left-color: #ef4444;">
                    <div class="summary-label">翻译文件缺失</div>
                    <div class="summary-value" id="missingInTranslation">0</div>
                </div>
                <div class="summary-item" style="border-left-color: #f59e0b;">
                    <div class="summary-label">原文文件缺失</div>
                    <div class="summary-value" id="missingInOriginal">0</div>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="result-section" id="missingInTranslationSection">
                <h3>❌ 翻译文件中缺失的键 (需要翻译)</h3>
                <div id="missingInTranslationTable"></div>
            </div>

            <div class="result-section" id="missingInOriginalSection">
                <h3>⚠️ 原文文件中缺失的键 (翻译文件多余)</h3>
                <div id="missingInOriginalTable"></div>
            </div>
        </div>
    </div>

    <script>
        let originalData = null;
        let translationData = null;

        function setupDropZone(zoneId, fileNameId, dataVar) {
            const zone = document.getElementById(zoneId);
            const fileName = document.getElementById(fileNameId);

            zone.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => handleFile(e.target.files[0], fileName, dataVar, zone);
                input.click();
            });

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                handleFile(e.dataTransfer.files[0], fileName, dataVar, zone);
            });
        }

        function handleFile(file, fileNameElement, dataVar, zone) {
            if (!file || !file.name.endsWith('.json')) {
                alert('请上传JSON文件!');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (dataVar === 'original') {
                        originalData = data;
                    } else {
                        translationData = data;
                    }
                    fileNameElement.textContent = `✓ ${file.name}`;
                    zone.classList.add('loaded');
                    checkReadyToCompare();
                } catch (error) {
                    alert('JSON文件格式错误!');
                }
            };
            reader.readAsText(file);
        }

        function checkReadyToCompare() {
            document.getElementById('compareBtn').disabled = !(originalData && translationData);
        }

        function flattenObject(obj, prefix = '') {
            const result = {};
            for (const key in obj) {
                const newKey = prefix ? `${prefix}.${key}` : key;
                if (typeof obj[key] === 'object' && obj[key] !== null && !Array.isArray(obj[key])) {
                    Object.assign(result, flattenObject(obj[key], newKey));
                } else {
                    result[newKey] = obj[key];
                }
            }
            return result;
        }

        function compareJSON() {
            const flatOriginal = flattenObject(originalData);
            const flatTranslation = flattenObject(translationData);

            const missingInTranslation = [];
            const missingInOriginal = [];

            for (const key in flatOriginal) {
                if (!(key in flatTranslation)) {
                    missingInTranslation.push({ key, value: flatOriginal[key] });
                }
            }

            for (const key in flatTranslation) {
                if (!(key in flatOriginal)) {
                    missingInOriginal.push({ key, value: flatTranslation[key] });
                }
            }

            displayResults(flatOriginal, flatTranslation, missingInTranslation, missingInOriginal);
        }

        function displayResults(original, translation, missingInTranslation, missingInOriginal) {
            document.getElementById('originalCount').textContent = Object.keys(original).length;
            document.getElementById('translationCount').textContent = Object.keys(translation).length;
            document.getElementById('missingInTranslation').textContent = missingInTranslation.length;
            document.getElementById('missingInOriginal').textContent = missingInOriginal.length;

            document.getElementById('summary').style.display = 'block';
            document.getElementById('results').style.display = 'block';

            displayTable('missingInTranslationTable', missingInTranslation, '原文值', '翻译值');
            displayTable('missingInOriginalTable', missingInOriginal, '翻译值', '原文值');
        }

        function displayTable(containerId, data, col1, col2) {
            const container = document.getElementById(containerId);
            if (data.length === 0) {
                container.innerHTML = '<div class="no-issues">✓ 没有发现问题</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40%">键路径</th>
                            <th style="width: 30%">${col1}</th>
                            <th style="width: 30%">${col2}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(item => {
                html += `
                    <tr>
                        <td><strong>${item.key}</strong></td>
                        <td>${JSON.stringify(item.value)}</td>
                        <td class="missing">无</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        setupDropZone('originalZone', 'originalFileName', 'original');
        setupDropZone('translationZone', 'translationFileName', 'translation');

        document.getElementById('compareBtn').addEventListener('click', compareJSON);
    </script>
</body>
</html>
