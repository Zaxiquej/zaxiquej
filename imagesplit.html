<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片分割处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .upload-area {
            background: white;
            border: 4px dashed #ccc;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover, .upload-area.drag-over {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area svg {
            width: 80px;
            height: 80px;
            color: #999;
            margin-bottom: 20px;
        }

        .upload-area p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }

        .upload-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-btn:hover {
            background: #5568d3;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .control-section {
            margin-bottom: 25px;
        }

        .control-section h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section label {
            display: block;
            color: #666;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .split-inputs {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
        }

        .split-inputs span {
            color: #999;
            font-size: 1.2em;
        }

        .offset-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }

        .offset-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .offset-item span {
            min-width: 60px;
            color: #666;
            font-size: 0.9em;
        }

        .offset-item input {
            flex: 1;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .range-value {
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download {
            background: #10b981;
            color: white;
        }

        .btn-download:hover {
            background: #059669;
        }

        .btn-download:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #6b7280;
            color: white;
        }

        .btn-reset:hover {
            background: #4b5563;
        }

        .preview-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .preview-box h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .canvas-container {
            overflow: auto;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9fafb;
            padding: 15px;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .result-img {
            max-width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            image-rendering: pixelated;
            background: linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc),
                        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 图片分割处理工具</h1>

        <div id="uploadArea" class="upload-area">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p>拖拽图片到这里，或点击上传</p>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">选择图片</button>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>

        <div id="mainContent" class="main-content hidden">
            <div class="control-panel">
                <div class="control-section">
                    <h3>📐 分割设置</h3>
                    <label>行 × 列</label>
                    <div class="split-inputs">
                        <input type="number" id="rows" value="4" min="1" max="20">
                        <span>×</span>
                        <input type="number" id="cols" value="3" min="1" max="20">
                    </div>
                </div>

                <div class="control-section">
                    <h3>↔️ 列偏移 (像素)</h3>
                    <div id="offsetList" class="offset-list"></div>
                </div>

                <div class="control-section">
                    <h3>💧 白色透明化</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="whiteTransparent">
                        <span>开启白色透明化</span>
                    </label>
                    <div id="similarityControl" class="hidden">
                        <label>相近度: <span id="similarityValue" class="range-value">10%</span></label>
                        <input type="range" id="whiteSimilarity" min="0" max="100" value="10">
                    </div>
                </div>

                <div class="control-section">
                    <h3>✂️ 裁剪边缘 (像素)</h3>
                    <label>裁剪左边</label>
                    <input type="number" id="cropLeft" value="0" min="0">
                    <label style="margin-top: 8px;">裁剪右边</label>
                    <input type="number" id="cropRight" value="0" min="0">
                    <label style="margin-top: 8px;">裁剪顶部</label>
                    <input type="number" id="cropTop" value="0" min="0">
                    <label style="margin-top: 8px;">裁剪底部</label>
                    <input type="number" id="cropBottom" value="0" min="0">
                </div>

                <div class="control-section">
                    <h3>📏 缩放模式</h3>
                    <label class="checkbox-label">
                        <input type="radio" name="scaleMode" value="size" checked>
                        <span>指定尺寸</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="radio" name="scaleMode" value="block">
                        <span>像素块缩放</span>
                    </label>

                    <div id="sizeMode">
                        <label>宽度</label>
                        <input type="number" id="finalWidth" value="800" min="1">
                        <label style="margin-top: 8px;">高度</label>
                        <input type="number" id="finalHeight" value="600" min="1">
                    </div>

                    <div id="blockMode" class="hidden">
                        <label>像素块大小</label>
                        <div class="split-inputs">
                            <input type="number" id="blockWidth" value="5" min="1">
                            <span>×</span>
                            <input type="number" id="blockHeight" value="5" min="1">
                        </div>
                        <p style="font-size: 0.85em; color: #999; margin-top: 8px;">
                            将宽度和高度分别除以像素块大小
                        </p>
                    </div>
                </div>

                <div class="control-section">
                    <label class="checkbox-label">
                        <input type="checkbox" id="showGrid" checked>
                        <span>显示分割网格</span>
                    </label>
                </div>

                <button id="downloadBtn" class="btn btn-download" disabled>
                    <span>⬇️ 下载处理后的图片</span>
                </button>
                <button id="resetBtn" class="btn btn-reset">
                    <span>🔄 重新上传</span>
                </button>
            </div>

            <div class="preview-area">
                <div class="preview-box">
                    <h3>原图预览</h3>
                    <div class="canvas-container">
                        <canvas id="previewCanvas"></canvas>
                    </div>
                </div>

                <div id="resultBox" class="preview-box hidden">
                    <h3>处理后预览</h3>
                    <div class="canvas-container">
                        <img id="resultImage" class="result-img">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let columnOffsets = {};

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const mainContent = document.getElementById('mainContent');
        const previewCanvas = document.getElementById('previewCanvas');
        const resultImage = document.getElementById('resultImage');
        const resultBox = document.getElementById('resultBox');

        // 上传相关
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
        });

        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        document.getElementById('finalWidth').value = img.width;
                        document.getElementById('finalHeight').value = img.height;
                        uploadArea.classList.add('hidden');
                        mainContent.classList.remove('hidden');
                        updateOffsetList();
                        drawPreview();
                        processImage();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 更新偏移列表
        function updateOffsetList() {
            const cols = parseInt(document.getElementById('cols').value);
            const offsetList = document.getElementById('offsetList');
            offsetList.innerHTML = '';

            for (let i = 0; i < cols; i++) {
                const div = document.createElement('div');
                div.className = 'offset-item';
                div.innerHTML = `
                    <span>第${i + 1}列:</span>
                    <input type="number" value="${columnOffsets[i] || 0}" data-col="${i}" class="offset-input">
                `;
                offsetList.appendChild(div);
            }

            document.querySelectorAll('.offset-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const col = parseInt(e.target.dataset.col);
                    columnOffsets[col] = parseInt(e.target.value) || 0;
                    drawPreview();
                    processImage();
                });
            });
        }

        // 绘制预览
        function drawPreview() {
            if (!currentImage) return;

            const ctx = previewCanvas.getContext('2d');
            const maxWidth = 600;
            const scale = Math.min(maxWidth / currentImage.width, 1);

            previewCanvas.width = currentImage.width * scale;
            previewCanvas.height = currentImage.height * scale;

            ctx.drawImage(currentImage, 0, 0, previewCanvas.width, previewCanvas.height);

            if (document.getElementById('showGrid').checked) {
                const rows = parseInt(document.getElementById('rows').value);
                const cols = parseInt(document.getElementById('cols').value);
                const cellWidth = previewCanvas.width / cols;
                const cellHeight = previewCanvas.height / rows;

                ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
                ctx.lineWidth = 2;

                for (let i = 1; i < cols; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cellWidth, 0);
                    ctx.lineTo(i * cellWidth, previewCanvas.height);
                    ctx.stroke();
                }

                for (let i = 1; i < rows; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * cellHeight);
                    ctx.lineTo(previewCanvas.width, i * cellHeight);
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
                for (let col = 0; col < cols; col++) {
                    const offset = columnOffsets[col] || 0;
                    if (offset !== 0) {
                        const x = col * cellWidth + offset * scale;
                        ctx.fillRect(x, 0, cellWidth, previewCanvas.height);
                    }
                }
            }
        }

        // 处理图片
        function processImage() {
            if (!currentImage) return;

            const rows = parseInt(document.getElementById('rows').value);
            const cols = parseInt(document.getElementById('cols').value);
            const whiteTransparent = document.getElementById('whiteTransparent').checked;
            const whiteSimilarity = parseInt(document.getElementById('whiteSimilarity').value);

            // 裁剪参数
            const cropLeft = parseInt(document.getElementById('cropLeft').value) || 0;
            const cropRight = parseInt(document.getElementById('cropRight').value) || 0;
            const cropTop = parseInt(document.getElementById('cropTop').value) || 0;
            const cropBottom = parseInt(document.getElementById('cropBottom').value) || 0;

            // 缩放模式
            const scaleMode = document.querySelector('input[name="scaleMode"]:checked').value;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);

            const cellWidth = currentImage.width / cols;
            const cellHeight = currentImage.height / rows;

            const newCanvas = document.createElement('canvas');
            const newCtx = newCanvas.getContext('2d');
            newCanvas.width = currentImage.width;
            newCanvas.height = currentImage.height;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const offset = columnOffsets[col] || 0;
                    const sx = col * cellWidth;
                    const sy = row * cellHeight;

                    const imageData = ctx.getImageData(sx, sy, cellWidth, cellHeight);

                    if (whiteTransparent) {
                        const data = imageData.data;
                        const threshold = (whiteSimilarity / 100) * 441.67;

                        for (let i = 0; i < data.length; i += 4) {
                            const dist = Math.sqrt(
                                Math.pow(data[i] - 255, 2) +
                                Math.pow(data[i + 1] - 255, 2) +
                                Math.pow(data[i + 2] - 255, 2)
                            );
                            if (dist < threshold) {
                                data[i + 3] = 0;
                            }
                        }
                    }

                    newCtx.putImageData(imageData, sx + offset, sy);
                }
            }

            // 裁剪
            const croppedWidth = newCanvas.width - cropLeft - cropRight;
            const croppedHeight = newCanvas.height - cropTop - cropBottom;
            const croppedCanvas = document.createElement('canvas');
            const croppedCtx = croppedCanvas.getContext('2d');
            croppedCanvas.width = croppedWidth;
            croppedCanvas.height = croppedHeight;
            croppedCtx.drawImage(newCanvas, cropLeft, cropTop, croppedWidth, croppedHeight, 0, 0, croppedWidth, croppedHeight);

            // 计算最终尺寸
            let finalWidth, finalHeight;
            if (scaleMode === 'size') {
                finalWidth = parseInt(document.getElementById('finalWidth').value);
                finalHeight = parseInt(document.getElementById('finalHeight').value);
            } else {
                const blockWidth = parseInt(document.getElementById('blockWidth').value) || 1;
                const blockHeight = parseInt(document.getElementById('blockHeight').value) || 1;
                finalWidth = Math.floor(croppedWidth / blockWidth);
                finalHeight = Math.floor(croppedHeight / blockHeight);
            }

            const finalCanvas = document.createElement('canvas');
            const finalCtx = finalCanvas.getContext('2d');
            finalCanvas.width = finalWidth;
            finalCanvas.height = finalHeight;

            finalCtx.imageSmoothingEnabled = false;
            finalCtx.drawImage(croppedCanvas, 0, 0, finalWidth, finalHeight);

            resultImage.src = finalCanvas.toDataURL('image/png');
            resultBox.classList.remove('hidden');
            document.getElementById('downloadBtn').disabled = false;
        }

        // 事件监听
        document.getElementById('rows').addEventListener('input', () => {
            drawPreview();
            processImage();
        });

        document.getElementById('cols').addEventListener('input', () => {
            updateOffsetList();
            drawPreview();
            processImage();
        });

        document.getElementById('showGrid').addEventListener('change', drawPreview);

        document.getElementById('whiteTransparent').addEventListener('change', (e) => {
            document.getElementById('similarityControl').classList.toggle('hidden', !e.target.checked);
            processImage();
        });

        document.getElementById('whiteSimilarity').addEventListener('input', (e) => {
            document.getElementById('similarityValue').textContent = e.target.value + '%';
            processImage();
        });

        document.getElementById('finalWidth').addEventListener('input', processImage);
        document.getElementById('finalHeight').addEventListener('input', processImage);

        document.getElementById('cropLeft').addEventListener('input', processImage);
        document.getElementById('cropRight').addEventListener('input', processImage);
        document.getElementById('cropTop').addEventListener('input', processImage);
        document.getElementById('cropBottom').addEventListener('input', processImage);

        document.getElementById('blockWidth').addEventListener('input', processImage);
        document.getElementById('blockHeight').addEventListener('input', processImage);

        document.querySelectorAll('input[name="scaleMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'size') {
                    document.getElementById('sizeMode').classList.remove('hidden');
                    document.getElementById('blockMode').classList.add('hidden');
                } else {
                    document.getElementById('sizeMode').classList.add('hidden');
                    document.getElementById('blockMode').classList.remove('hidden');
                }
                processImage();
            });
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'processed_image.png';
            link.href = resultImage.src;
            link.click();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            currentImage = null;
            columnOffsets = {};
            mainContent.classList.add('hidden');
            uploadArea.classList.remove('hidden');
            fileInput.value = '';
            resultBox.classList.add('hidden');
            document.getElementById('downloadBtn').disabled = true;
        });
    </script>
</body>
</html>
